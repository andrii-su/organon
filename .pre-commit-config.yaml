repos:
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: ruff check --fix (Python)
        entry: uv run --group dev ruff check --fix
        language: system
        files: ^(ai|tests|tools)/.*\.py$

      - id: ruff-format
        name: ruff format (Python)
        entry: uv run --group dev ruff format
        language: system
        files: ^(ai|tests|tools)/.*\.py$

      - id: rustfmt
        name: rustfmt (workspace)
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        files: \.rs$

      - id: clippy-fix
        name: clippy --fix (workspace)
        entry: cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings
        language: system
        pass_filenames: false
        files: \.rs$
