name: Autostart smoke

on:
  pull_request:
    paths:
      - "crates/organon-cli/src/autostart.rs"
      - "tests/autostart_smoke.py"
      - ".github/workflows/autostart-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autostart:
    name: Autostart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --locked --group dev

      - name: Start Linux user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"

      - name: Build Organon
        run: cargo build --locked --bin organon

      - name: Exercise autostart
        run: python3 tests/autostart_smoke.py target/debug/organon
