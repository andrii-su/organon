name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo build
        run: cargo build --locked

      - name: MCP protocol smoke test
        run: python3 tests/mcp_smoke.py target/debug/organon

      - name: Filesystem query contract
        run: python3 tests/organon_contract.py target/debug/organon

      - name: Previous release database migration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh release view --json tagName --jq .tagName)"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$previous" --pattern 'organon-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP/previous-release"
          tar -xzf "$RUNNER_TEMP/previous-release/organon-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/previous-release"
          python3 tests/migration_smoke.py "$RUNNER_TEMP/previous-release/organon-x86_64-unknown-linux-gnu/organon" target/debug/organon

      - name: cargo test
        run: cargo test --locked

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --locked --group dev pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: uv sync --locked --group dev

      - name: ruff check
        run: uv run --locked --group dev ruff check ai tests tools
