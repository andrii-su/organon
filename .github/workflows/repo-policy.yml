name: Repo Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^((feat|fix|chore|docs|refactor|test|ci|build|style|perf|revert)\/[a-z0-9][a-z0-9._/-]*|(dependabot|renovate)\/.+)$'
          if [[ "$BRANCH_NAME" =~ $pattern ]]; then
            echo "Branch name OK: $BRANCH_NAME"
            exit 0
          fi

          echo "Invalid branch name: $BRANCH_NAME"
          echo "Expected: <type>/<slug>, for example feat/context-command"
          exit 1

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            style
            perf
            revert

  commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Install commitlint
        run: npm install --global @commitlint/cli@20 @commitlint/config-conventional@20

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: commitlint --config .commitlintrc.yml --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
