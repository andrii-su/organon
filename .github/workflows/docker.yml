name: Docker

# Build and publish the Organon MCP server image to GitHub Container Registry
# (ghcr.io/<owner>/organon) on each `vX.Y.Z` tag, plus `latest`.
#
# linux/amd64 only for now — it runs on Apple Silicon via Docker's emulation,
# which is fine for a stdio MCP server. Multi-arch can be added later.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/organon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/organon
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Pull and run published image
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/organon@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker run --rm "$image" --version | grep -Fx "organon ${GITHUB_REF_NAME#v}"

      - name: Verify image attestation
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://ghcr.io/${{ github.repository_owner }}/organon@${{ steps.build.outputs.digest }}" --repo "$GITHUB_REPOSITORY"
