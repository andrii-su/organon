name: Release

# Build prebuilt `organon` binaries for each tagged release and attach them to a
# GitHub Release. The Package smoke workflow creates tags after merged PRs pass.
#
# The binaries cover the Rust core + CLI + MCP server. The Python AI layer
# (semantic vectors) is installed separately via `uv sync`; the MCP graph,
# lifecycle, history, and impact tools work from the binary alone.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross-linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin organon

      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/organon"
          dist="organon-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "$bin" "$dist/"
          cp README.md LICENSE "$dist/"
          tar -czf "$dist.tar.gz" "$dist"
          shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: organon-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: organon-${{ matrix.target }}
          path: |
            organon-${{ matrix.target }}.tar.gz
            organon-${{ matrix.target }}.tar.gz.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  verify:
    name: verify published release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json assets | python3 tools/verify_release.py assets

      - name: Download release archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --pattern 'organon-*.tar.gz*' --dir "$RUNNER_TEMP/release"

      - name: Verify all checksums and runnable version
        run: python3 tools/verify_release.py archives "$RUNNER_TEMP/release" "$GITHUB_REF_NAME"

      - name: Verify build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in "$RUNNER_TEMP"/release/*.tar.gz; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
          done
